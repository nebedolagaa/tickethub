{% load static %}
<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mine billetter - TicketHub</title>

    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{% static 'favicon/apple-touch-icon.png' %}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{% static 'favicon/favicon-32x32.png' %}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{% static 'favicon/favicon-16x16.png' %}"
    />
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}" />

    <link rel="stylesheet" href="{% static 'main.css' %}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    {% include 'snippets/navbar.html' %}

    <div class="NP-page-container">
      <div class="NP-content-section" style="max-width: 1200px; margin: 0 auto">
        <h1
          style="
            margin-bottom: 1.5rem;
            color: var(--th-white);
            text-align: center;
          "
        >
          Mine billetter
        </h1>
        <p
          style="
            color: var(--th-muted);
            margin-bottom: 2rem;
            text-align: center;
          "
        >
          Her finner du alle dine kjøpte billetter. Klikk på en billett for å se
          detaljer eller laste den ned.
        </p>

        {% include 'snippets/ticket_card.html' %}
      </div>
    </div>

    {% include 'snippets/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
