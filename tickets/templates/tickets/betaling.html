{% extends "base.html" %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'main.css' %}">
<link rel="stylesheet" href="{% static 'tickets/betaling.css' %}">
{% endblock %}

{% block title %}Betaling{% endblock %}

{% block content %}
<main class="CB-payment-main">
    <div class="CB-payment-container">
        <!-- Venstre side: Kontaktinformasjon -->
        <div class="CB-payment-form-section">
            <h2 class="CB-payment-title">Kontaktinformasjon</h2>
            <form method="post" class="CB-payment-form">
                {% csrf_token %}

                <div class="CB-payment-form-group">
                    <label for="fullname">Fullt navn</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Ditt navn" required>
                </div>

                <div class="CB-payment-form-group">
                    <label for="email">E-post</label>
                    <input type="email" id="email" name="email" placeholder="din@epost.no" required>
                </div>

                <div class="CB-payment-form-group">
                    <label for="phone">Telefon</label>
                    <input type="tel" id="phone" name="phone" placeholder="+47 000 00 000" required>
                </div>

                <div class="CB-payment-form-group">
                    <label for="address">Adresse</label>
                    <input type="text" id="address" name="address" placeholder="Gateadresse" required>
                </div>

                <div class="CB-payment-form-row">
                    <div class="CB-payment-form-group">
                        <label for="city">By</label>
                        <input type="text" id="city" name="city" placeholder="By" required>
                    </div>
                    <div class="CB-payment-form-group">
                        <label for="postal">Postnummer</label>
                        <input type="text" id="postal" name="postal" placeholder="0000" required>
                    </div>
                </div>

                <!-- Høyre side vil ligge ved siden av her -->
            </form>
        </div>

        <!-- Høyre side: Sammendrag -->
        <div class="CB-payment-summary-section">
            <h2 class="CB-payment-title">Sammendrag</h2>

            <!-- Billetliste -->
            <div class="CB-payment-summary-items">
                <div class="CB-payment-item">
                    <div class="CB-payment-item-info">
                        <p class="CB-payment-item-name">Billett 1</p>
                        <p class="CB-payment-item-desc">Kategori: VIP</p>
                    </div>
                    <p class="CB-payment-item-price">499 kr</p>
                </div>
                <div class="CB-payment-item">
                    <div class="CB-payment-item-info">
                        <p class="CB-payment-item-name">Billett 2</p>
                        <p class="CB-payment-item-desc">Kategori: Standard</p>
                    </div>
                    <p class="CB-payment-item-price">299 kr</p>
                </div>
            </div>

            <!-- Divider -->
            <div class="CB-payment-divider"></div>

            <!-- Totalpris -->
            <div class="CB-payment-total">
                <p class="CB-payment-total-label">Totalt:</p>
                <p class="CB-payment-total-price">798 kr</p>
            </div>

            <!-- Betalingsmåte -->
            <div class="CB-payment-method">
                <label for="payment-method">Betalingsmåte</label>
                <select id="payment-method" name="payment-method" required>
                    <option value="">Velg betalingsmåte</option>
                    <option value="card">Kredittkort</option>
                    <option value="bank">Bankoverføring</option>
                    <option value="vipps">Vipps</option>
                </select>
            </div>

            <!-- Submit knapp -->
            <button type="submit" class="CB-payment-btn-submit">Fullfør betaling</button>
        </div>
    </div>
</main>
{% endblock %}
