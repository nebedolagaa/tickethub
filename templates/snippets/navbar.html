<nav class="navbar-CB">
  <div class="navbar-container-CB">
    <!-- Logo -->
    <a href="/" class="navbar-logo-CB">
      <span class="MB-white-text" style="font-size: 1.5rem; font-weight: 700"
        >ticket</span
      ><span class="MB-red-text" style="font-size: 1.5rem; font-weight: 700"
        >hub</span
      >
    </a>

    <div class="navbar-menu-CB">
      <a href="/">Hovedside</a>
      <a href="{% url 'all_events' %}">Alle konserter</a>
      <a href="{% url 'festivals' %}">Festivaler</a>
      <a href="#">Byer</a>
      <a href="#">Arrangør?</a>
    </div>

    <div class="navbar-actions-CB">
      <!-- Søke-knapp -->
      <button class="navbar-btn-CB search-red-CB" id="search-btn-CB">
        <i class="bi bi-search"></i> <span class="search-btn-text-CB">Søk</span>
      </button>
      <!-- Login -->
      {% if user.id is None %}
      <a
        href="{% url 'users:login' %}"
        class="navbar-btn-CB"
        style="text-decoration: none"
      >
        <i class="bi bi-person"></i>
        <span class="login-btn-text-CB">Logg inn</span>
      </a>
      <!-- Registrer deg button (far right) -->
      <a href="{% url 'users:register' %}" class="register-btn-CB"
        >Registrer deg</a
      >

      {% else %}
      <a href="#" class="navbar-btn-CB" style="text-decoration: none">
        <i class="bi bi-person"></i>
        <span class="login-btn-text-CB">Min profil</span>
      </a>
      <!-- Logg ut button (far right) -->
      <form method="post" action="{% url 'logout' %}" style="display: inline">
        {% csrf_token %}
        <button
          type="submit"
          class="register-btn-CB"
          style="border: none; cursor: pointer"
        >
          Logg ut
        </button>
      </form>
      {% endif %}
      <!-- Hamburger (mobil) -->
      <button id="menu-toggle-CB" class="navbar-btn-CB">☰</button>
    </div>
  </div>

  <div id="mobile-menu-CB" class="mobile-menu-CB" style="display: none">
    <a href="/">Hjem</a>
    <a href="/">Hovedside</a>
    <a href="{% url 'all_events' %}">Alle konserter</a>
    <a href="#">Musikksjangler</a>
    <a href="#">Support</a>
  </div>
</nav>

<script>
  const toggle = document.getElementById("menu-toggle-CB");
  const menu = document.getElementById("mobile-menu-CB");
  if (toggle && menu) {
    toggle.onclick = () => {
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    };
  }
</script>
