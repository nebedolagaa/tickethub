{% extends "base.html" %}
{% load static %}

{% block title %}Logg inn{% endblock %}

{% block content %}
<main class="CB1-main">
    <div class="CB1-login-card">
        <h1 class="CB1-title">Logg inn</h1>
        <p class="CB1-subtitle">Velkommen tilbake</p>

        <form method="post" class="CB1-form">
            {% csrf_token %}

            <div class="CB1-form-group">
                <label for="username">E-post</label>
                <input type="text" name="username" id="username" placeholder="din@epost.no" required>
            </div>

            <div class="CB1-form-group">
                <label for="password">Passord</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
            </div>

            {% if form.errors %}
                <div class="CB1-error">Feil brukernavn eller passord</div>
            {% endif %}

            <div class="CB1-form-row">
                <label class="CB1-checkbox">
                    <input type="checkbox" name="remember"> Husk meg
                </label>
                <a href="#" class="CB1-forgot">Glemt passord?</a>
            </div>

            <button type="submit" class="CB1-btn-submit">Logg inn</button>
        </form>

        <div class="CB1-register-text">
            Har du ikke konto? <a href="#">Registrer deg her</a>
        </div>
    </div>
</main>
{% endblock %}
